<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1F3D2B">
<title>خدمات wossol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#17261D;--olive:#1F3D2B;--leaf:#3F7A4F;--saffron:#F0AE1C;--chalk:#F3F5F0;--line:#D9E0D4;--mute:#5E6B61;--danger:#B3382C;--ok:#2E7D4F}
*{box-sizing:border-box}
body{margin:0;font-family:'Readex Pro',Tahoma,Arial,sans-serif;background:var(--chalk);color:var(--ink);line-height:1.7;font-size:16px}
.wrap{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--chalk)}
header.top{background:var(--olive);color:#fff;padding:12px 16px}
header.top .t{font-size:20px;font-weight:700}
header.top .s{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:2px;font-size:13px;color:#D8E4D6}
header.top button{background:transparent;border:1px solid #6E8F78;color:#fff;border-radius:8px;padding:4px 10px;font:inherit;font-size:12px;cursor:pointer;min-height:32px}
main{flex:1;padding:16px 16px 96px}
nav.tabs{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;background:#fff;border-top:1px solid var(--line);display:flex}
nav.tabs button{flex:1;padding:12px 4px;border:0;border-top:3px solid transparent;background:none;font:inherit;font-size:14px;color:var(--mute);cursor:pointer}
nav.tabs button.on{color:var(--olive);border-top-color:var(--saffron);font-weight:500}
h2{font-size:20px;margin:0 0 4px;font-weight:700}
.sub{color:var(--mute);font-size:14px;margin:0 0 16px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card .head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.card .name{font-weight:500}
.meta{font-size:14px;color:var(--mute)}
.fee{color:var(--ok);font-weight:500}
.btn{background:var(--saffron);color:var(--ink);border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:500;cursor:pointer;min-height:44px}
.btn:disabled{opacity:.6;cursor:default}
.btn.full{width:100%}
.btn.dark{background:var(--olive);color:#fff}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn.sm{min-height:38px;padding:6px 12px;font-size:14px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
label{font-size:14px;color:var(--mute);display:block}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;background:#fff;margin:4px 0 12px;min-height:44px;color:var(--ink)}
textarea{min-height:84px;resize:vertical}
input[type=checkbox]{width:20px;height:20px;min-height:0;margin:0 0 0 8px}
.check{display:flex;align-items:center;margin:4px 0 12px}
.check label{color:var(--ink);font-size:15px}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--saffron);outline-offset:1px}
.badge{font-size:12px;padding:2px 10px;border-radius:20px;background:#E6EDE2;color:var(--olive);white-space:nowrap}
.badge.wait{background:#FFF1CC;color:#6B4E00}
.badge.go{background:#DDEFE3;color:#1E5C3A}
.badge.end{background:#E7E7E7;color:#444}
.badge.bad{background:#F6DCD8;color:#8A2A20}
.err{color:var(--danger);font-size:14px;min-height:20px;margin:-4px 0 8px}
.empty{text-align:center;color:var(--mute);padding:28px 8px;border:1px dashed var(--line);border-radius:14px}
.roles{display:grid;gap:12px;margin-top:8px}
.role{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:16px;text-align:right;font:inherit;cursor:pointer;display:block;width:100%}
.role strong{display:block;font-size:18px;color:var(--olive)}
.role span{font-size:14px;color:var(--mute)}
.role:hover,.role:focus-visible{border-color:var(--saffron)}
.seg{display:flex;gap:6px;margin-bottom:16px}
.seg button{flex:1;padding:10px;border:1px solid var(--line);background:#fff;border-radius:10px;font:inherit;cursor:pointer;color:var(--mute)}
.seg button.on{background:var(--olive);color:#fff;border-color:var(--olive)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-size:22px;color:var(--olive)}
.stat span{font-size:13px;color:var(--mute)}
.info{font-size:13px;color:var(--mute);background:#fff;border:1px dashed var(--line);border-radius:10px;padding:8px 12px;margin:0 0 14px}
#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center;z-index:5}
#toast.show{opacity:1}
a.link{color:var(--leaf);font-weight:500}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ===== الإعداد: الصق هنا قيمتين من إعدادات مشروعك في Supabase (Project Settings > API) ===== */
var SUPABASE_URL = 'https://nnozlrxxleutxwbznbza.supabase.co';
var SUPABASE_KEY = 'sb_publishable_AicCXULMxPLjb3wqw4eyEw_RFoydgHK';
/* لا تضع هنا أبداً مفتاح service_role */

var CATS=['بقالة','قطع غيار','خضر وفواكه','أخرى'];
var VEH=['دراجة','سيارة صغيرة','شاحنة صغيرة','شاحنة كبيرة'];
var ROLE={buyer:'مشتري',courier:'عامل توصيل',seller:'بائع'};
var STATUS={
  pending_seller:['بانتظار موافقة البائع','wait'],
  open:['بانتظار عامل توصيل','wait'],
  accepted:['قبله عامل التوصيل','go'],
  bought:['تم شراؤه وهو في الطريق','go'],
  delivered:['تم التسليم','end'],
  cancelled:['ملغى','end'],
  rejected:['رفضه البائع','bad']
};
var TABS={
  buyer:[['new','طلب جديد'],['mine','طلباتي'],['shop','المتجر']],
  courier:[['browse','تصفح الطلبات'],['active','طلباتي'],['earn','أرباحي']],
  seller:[['products','منتجاتي'],['sorders','طلبات المتجر']]
};
var POLL_TABS=['browse','active','mine','sorders'];

var app=document.getElementById('app');
var sb=null, user=null, role=null, tab=null, openProd=null, filterCat='', authMode='login', rid=0, toastTimer;
var configured=!/PASTE_/.test(SUPABASE_URL+SUPABASE_KEY);

try{role=localStorage.getItem('souq_role');if(!ROLE[role])role=null;}catch(e){role=null;}

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function toast(m){var t=document.getElementById('toast');t.textContent=m;t.className='show';clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.className='';},2800);}
function msg(e){
  var m=(e&&e.message)||String(e);
  var map=[['Invalid login credentials','البريد الإلكتروني أو كلمة السر غير صحيحة.'],['User already registered','هذا البريد مسجّل من قبل. جرّب تسجيل الدخول.'],
    ['at least','كلمة السر قصيرة (6 أحرف على الأقل).'],['Email not confirmed','أكّد بريدك الإلكتروني أولاً ثم سجّل الدخول.'],
    ['Failed to fetch','تعذّر الاتصال بالإنترنت.'],['NetworkError','تعذّر الاتصال بالإنترنت.'],['rate limit','محاولات كثيرة. انتظر قليلاً ثم أعد المحاولة.'],
    ['valid email','أدخل بريداً إلكترونياً صحيحاً.']];
  for(var i=0;i<map.length;i++){if(m.indexOf(map[i][0])>-1)return map[i][1];}
  return m;
}
function chk(r){if(r.error)throw r.error;return r.data||[];}
function badge(st){var s=STATUS[st]||[st,''];return '<span class="badge '+s[1]+'">'+esc(s[0])+'</span>';}
function mapsLink(q){return 'https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(q);}
function telLink(p){var d=String(p||'').replace(/[^0-9+]/g,'');return d?'<a class="link" href="tel:'+d+'">'+esc(p)+'</a>':'—';}
function opts(arr,sel){return arr.map(function(x){return '<option'+(x===sel?' selected':'')+'>'+esc(x)+'</option>';}).join('');}
function val(f,n){return (f.elements[n]&&f.elements[n].value||'').trim();}
function userName(){return (user&&user.user_metadata&&user.user_metadata.name)||'';}
function go(t){tab=t;render();window.scrollTo(0,0);}
function isEditing(){var a=document.activeElement;return !!a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName);}

function shell(inner,withNav){
  var head='<header class="top"><div class="t">خدمات wossol</div>'+(user?'<div class="s"><span>'+esc(userName())+(role?' · '+ROLE[role]:'')+'</span><span>'+(role?'<button onclick="switchRole()">تغيير الدور</button> ':'')+'<button onclick="logout()">خروج</button></span></div>':'<div class="s"><span>اشترِ، وصّل، وبِع من حيّك</span></div>')+'</header>';
  var nav='';
  if(withNav){nav='<nav class="tabs">'+TABS[role].map(function(t){return '<button class="'+(t[0]===tab?'on':'')+'" onclick="go(\''+t[0]+'\')">'+t[1]+'</button>';}).join('')+'</nav>';}
  return '<div class="wrap">'+head+'<main>'+inner+'</main>'+nav+'</div>';
}

async function render(silent){
  var id=++rid;
  if(!configured){app.innerHTML=shell(setupView(),false);return;}
  if(!sb){app.innerHTML=shell('<div class="empty">تعذّر تحميل مكتبة الاتصال. تأكد من الإنترنت ثم أعد فتح الصفحة.</div>',false);return;}
  if(!user){app.innerHTML=shell(authView(),false);return;}
  if(!role){app.innerHTML=shell(roleView(),false);return;}
  var tabs=TABS[role];
  if(!tabs.some(function(t){return t[0]===tab;}))tab=tabs[0][0];
  if(!silent)app.innerHTML=shell('<div class="empty">جارٍ التحميل…</div>',true);
  var html;
  try{html=await VIEWS[tab]();}
  catch(e){html='<div class="empty">'+esc(msg(e))+'<div class="actions" style="justify-content:center"><button class="btn sm" onclick="render()">إعادة المحاولة</button></div></div>';}
  if(id!==rid)return;
  app.innerHTML=shell(html,true);
}

function setupView(){
  return '<h2>الإعداد غير مكتمل</h2><p class="sub">افتح ملف index.html وضع عنوان مشروعك ومفتاحه العام في أول السكربت (SUPABASE_URL و SUPABASE_KEY)، ثم أعد فتح الصفحة.</p>';
}
function authView(){
  var s=authMode==='signup';
  return '<div class="seg"><button class="'+(s?'':'on')+'" onclick="setAuth(\'login\')">دخول</button><button class="'+(s?'on':'')+'" onclick="setAuth(\'signup\')">حساب جديد</button></div>'+
  '<form onsubmit="return doAuth(event)">'+
  (s?'<label>الاسم</label><input name="name" autocomplete="name" placeholder="مثال: أمينة"><label>رقم الهاتف</label><input name="phone" inputmode="tel" autocomplete="tel" placeholder="0550 00 00 00">':'')+
  '<label>البريد الإلكتروني</label><input name="email" type="email" inputmode="email" autocomplete="email" dir="ltr" style="text-align:right">'+
  '<label>كلمة السر'+(s?' (6 أحرف على الأقل)':'')+'</label><input name="password" type="password" autocomplete="'+(s?'new-password':'current-password')+'" dir="ltr" style="text-align:right">'+
  '<div class="err" id="err"></div><button class="btn full" id="authBtn" type="submit">'+(s?'إنشاء الحساب':'دخول')+'</button></form>';
}
function roleView(){
  return '<h2>اختر دورك في التطبيق</h2><p class="sub">يمكنك تغيير دورك في أي وقت.</p><div class="roles">'+
  '<button class="role" onclick="setRole(\'buyer\')"><strong>مشتري</strong><span>قدّم طلبية أو تصفّح المتجر</span></button>'+
  '<button class="role" onclick="setRole(\'courier\')"><strong>عامل توصيل</strong><span>اقبل الطلبات واشترِها وأوصلها</span></button>'+
  '<button class="role" onclick="setRole(\'seller\')"><strong>بائع</strong><span>اعرض منتجاتك في المتجر</span></button></div>';
}

async function getPrivate(ids){
  if(!ids.length)return {};
  var l=chk(await sb.from('order_private').select('*').in('order_id',ids)),m={};
  l.forEach(function(p){m[p.order_id]=p;});return m;
}

var VIEWS={
 new:async function(){
  return '<h2>طلبية جديدة</h2><p class="sub">حدّد ما ينقصك وسيشتريه لك عامل توصيل.</p>'+
  '<form onsubmit="return submitErrand(event)"><label>نوع الطلب</label><select name="cat">'+opts(CATS)+'</select>'+
  '<label>ما الذي تحتاجه؟</label><textarea name="items" maxlength="500" placeholder="مثال: 2 خبز، 1 حليب، 6 بيض"></textarea>'+
  '<label>الحي أو المنطقة (يراها عمال التوصيل)</label><input name="area" maxlength="100" placeholder="مثال: حي النصر">'+
  '<label>العنوان بالتفصيل (لا يراه إلا من يقبل طلبك)</label><input name="address" maxlength="300" placeholder="الشارع، رقم المنزل، علامة مميزة">'+
  '<label>عمولة التوصيل (دج)</label><input name="fee" type="number" min="0" inputmode="numeric" value="200">'+
  '<div class="check"><input type="checkbox" id="inter" onchange="toggleInter(this)"><label for="inter">توصيل إلى ولاية أخرى</label></div>'+
  '<div id="interBox" hidden><label>الولاية</label><input name="state" maxlength="60" placeholder="اسم الولاية"><label>نوع وحجم وسيلة النقل</label><select name="veh">'+opts(VEH)+'</select></div>'+
  '<div class="err" id="err"></div><button class="btn full" id="sendBtn" type="submit">إرسال الطلب</button></form>';
 },
 mine:async function(){
  var l=chk(await sb.from('orders').select('*').eq('buyer_id',user.id).order('created_at',{ascending:false}));
  if(!l.length)return '<h2>طلباتي</h2><div class="empty">لا توجد طلبات بعد. قدّم طلبك الأول من تبويب «طلب جديد».</div>';
  return '<h2>طلباتي</h2><p class="sub">تابع حالة طلباتك.</p>'+l.map(function(o){
   var t='<div class="card"><div class="head"><span class="name">'+esc(o.items)+'</span>'+badge(o.status)+'</div><div class="meta">'+esc(o.cat)+' · '+esc(o.area)+'</div>';
   if(o.interstate)t+='<div class="meta">إلى ولاية '+esc(o.state||'—')+' · '+esc(o.veh)+'</div>';
   if(o.kind==='store')t+='<div class="meta">من متجر '+esc(o.seller_name)+' · الدفع: '+(o.payment==='credit'?'بالآجل (باتفاق مع البائع)':'نقداً')+' · المنتجات: '+o.total+' دج</div>';
   t+='<div class="meta">عمولة التوصيل: <span class="fee">'+o.fee+' دج</span></div>';
   if(o.courier_name)t+='<div class="meta">عامل التوصيل: '+esc(o.courier_name)+'</div>';
   if(o.status==='delivered'&&o.kind==='errand')t+='<div class="meta">المجموع: '+((+o.paid||0)+o.fee)+' دج (المشتريات '+(+o.paid||0)+' + التوصيل '+o.fee+')</div>';
   if(o.status==='open'||o.status==='pending_seller')t+='<div class="actions"><button class="btn danger sm" onclick="cancelOrder('+o.id+')">إلغاء الطلب</button></div>';
   return t+'</div>';}).join('');
 },
 shop:async function(){
  var l=chk(await sb.from('products').select('*').order('created_at',{ascending:false}));
  var h='<h2>المتجر</h2><p class="sub">منتجات من أسر منتجة وتجار قريبين منك.</p>';
  if(!l.length)return h+'<div class="empty">لا توجد منتجات بعد. سيظهر هنا ما يضيفه البائعون.</div>';
  return h+l.map(function(p){
   var t='<div class="card"><div class="head"><span class="name">'+esc(p.name)+'</span><span class="fee">'+p.price+' دج</span></div>'+
    '<div class="meta">'+esc(p.descr)+'</div><div class="meta">البائع: '+esc(p.seller_name)+(p.interstate?' · يشحن بين الولايات':'')+'</div>';
   if(p.seller_id===user.id)t+='<div class="meta">هذا منتجك</div>';
   else if(openProd===p.id){
    t+='<form onsubmit="return orderProduct(event,'+p.id+')" style="margin-top:12px"><label>الكمية</label><input name="qty" type="number" min="1" max="100" value="1" inputmode="numeric">'+
     '<label>الحي أو المنطقة</label><input name="area" maxlength="100">'+
     '<label>العنوان بالتفصيل (لا يراه إلا من يقبل طلبك)</label><input name="address" maxlength="300">'+
     '<label>عمولة التوصيل (دج)</label><input name="fee" type="number" min="0" value="200" inputmode="numeric">'+
     '<label>طريقة الدفع</label><select name="pay"><option value="cash">نقداً عند الاستلام</option><option value="credit">بالآجل (يوافق عليه البائع)</option></select>'+
     '<div class="err" id="err"></div><div class="actions"><button class="btn" type="submit">تأكيد الطلب</button><button type="button" class="btn ghost" onclick="toggleProd(null)">إلغاء</button></div></form>';
   }else t+='<div class="actions"><button class="btn sm" onclick="toggleProd('+p.id+')">اطلب</button></div>';
   return t+'</div>';}).join('');
 },
 browse:async function(){
  var cats=['الكل'].concat(CATS).concat(['متجر','بين الولايات']);
  var q=sb.from('orders').select('*').eq('status','open').neq('buyer_id',user.id).order('created_at',{ascending:false});
  var l=chk(await q).filter(function(o){
   if(!filterCat||filterCat==='الكل')return true;
   if(filterCat==='بين الولايات')return o.interstate;
   if(filterCat==='متجر')return o.kind==='store';
   return o.cat===filterCat;});
  var h='<h2>تصفح الطلبات</h2><p class="sub">اقبل طلباً يناسبك، اشتره وأوصله.</p><select onchange="setFilter(this.value)" aria-label="تصفية الطلبات">'+opts(cats,filterCat||'الكل')+'</select>';
  if(!l.length)return h+'<div class="empty">لا توجد طلبات متاحة الآن. عُد بعد قليل.</div>';
  return h+l.map(function(o){
   var t='<div class="card"><div class="head"><span class="name">'+esc(o.items)+'</span><span class="fee">'+o.fee+' دج</span></div><div class="meta">'+esc(o.cat)+' · '+esc(o.area)+'</div>';
   if(o.kind==='store')t+='<div class="meta">استلام من متجر '+esc(o.seller_name)+'</div>';
   if(o.interstate)t+='<div class="meta">إلى ولاية '+esc(o.state||'—')+' · يلزم: '+esc(o.veh)+'</div>';
   return t+'<div class="actions"><button class="btn sm" onclick="acceptOrder('+o.id+')">قبول الطلب</button></div></div>';}).join('');
 },
 active:async function(){
  var l=chk(await sb.from('orders').select('*').eq('courier_id',user.id).in('status',['accepted','bought']).order('created_at',{ascending:false}));
  if(!l.length)return '<h2>طلباتي</h2><div class="empty">لا توجد طلبات جارية. اقبل طلباً من «تصفح الطلبات».</div>';
  var pv=await getPrivate(l.map(function(o){return o.id;}));
  return '<h2>طلباتي الجارية</h2>'+l.map(function(o){
   var p=pv[o.id]||{},addr=p.address||'';
   var t='<div class="card"><div class="head"><span class="name">'+esc(o.items)+'</span>'+badge(o.status)+'</div>'+
    '<div class="meta">العنوان: '+esc(addr)+' ('+esc(o.area)+')</div><div class="meta">صاحب الطلب: '+esc(o.buyer_name)+' · '+telLink(p.buyer_phone)+'</div>';
   if(o.kind==='store')t+='<div class="meta">استلام من البائع: '+esc(o.seller_name)+' · '+telLink(p.seller_phone)+'</div>';
   t+='<div class="meta">عمولتك: <span class="fee">'+o.fee+' دج</span></div>'+
    '<div class="actions"><a class="link" href="'+mapsLink(addr+'، '+o.area)+'" target="_blank" rel="noopener">فتح المسار في خرائط جوجل</a></div>';
   if(o.status==='accepted'){
    if(o.kind==='store')t+='<div class="actions"><button class="btn sm" onclick="markBought('+o.id+')">استلمت الطلب من المتجر</button><button class="btn danger sm" onclick="releaseOrder('+o.id+')">التخلي عن الطلب</button></div>';
    else t+='<div style="margin-top:10px"><label>المبلغ الذي دفعته للمشتريات (دج)</label><input id="paid'+o.id+'" type="number" min="1" inputmode="numeric" placeholder="مثال: 850"><div class="actions" style="margin-top:0"><button class="btn sm" onclick="markBought('+o.id+')">اشتريت الطلب</button><button class="btn danger sm" onclick="releaseOrder('+o.id+')">التخلي عن الطلب</button></div></div>';
   }else t+='<div class="actions"><button class="btn dark sm" onclick="markDelivered('+o.id+')">تم التسليم</button></div>';
   return t+'</div>';}).join('');
 },
 earn:async function(){
  var l=chk(await sb.from('orders').select('*').eq('courier_id',user.id).eq('status','delivered').order('delivered_at',{ascending:false}));
  var sum=l.reduce(function(a,o){return a+o.fee;},0);
  var h='<h2>أرباحي</h2><div class="stats"><div class="stat"><b>'+sum+' دج</b><span>مجموع العمولات</span></div><div class="stat"><b>'+l.length+'</b><span>طلبات مسلّمة</span></div></div>';
  if(!l.length)return h+'<div class="empty">ستظهر هنا الطلبات التي سلّمتها.</div>';
  return h+l.map(function(o){return '<div class="card"><div class="head"><span class="name">'+esc(o.items)+'</span><span class="fee">+'+o.fee+' دج</span></div><div class="meta">'+(o.kind==='errand'?'المشتريات المسدّدة لك: '+(+o.paid||0)+' دج':'طلب من متجر '+esc(o.seller_name))+'</div></div>';}).join('');
 },
 products:async function(){
  var l=chk(await sb.from('products').select('*').eq('seller_id',user.id).order('created_at',{ascending:false}));
  var h='<h2>منتجاتي</h2><p class="sub">اعرض ما تصنعه أو تبيعه، من أكلات منزلية وحلويات وغيرها.</p>'+
  '<form class="card" onsubmit="return addProduct(event)"><label>اسم المنتج</label><input name="name" maxlength="80" placeholder="مثال: كسكس يدوي">'+
  '<label>السعر (دج)</label><input name="price" type="number" min="1" inputmode="numeric">'+
  '<label>وصف قصير</label><input name="descr" maxlength="200" placeholder="مثال: نصف جاهز، كيلوغرام واحد">'+
  '<div class="check"><input type="checkbox" name="inter" id="pi"><label for="pi">أستطيع الشحن بين الولايات</label></div>'+
  '<div class="err" id="err"></div><button class="btn full" type="submit">إضافة المنتج</button></form>';
  if(!l.length)return h+'<div class="empty">لم تضف منتجات بعد.</div>';
  return h+l.map(function(p){return '<div class="card"><div class="head"><span class="name">'+esc(p.name)+'</span><span class="fee">'+p.price+' دج</span></div><div class="meta">'+esc(p.descr)+'</div><div class="actions"><button class="btn danger sm" onclick="delProduct('+p.id+')">حذف</button></div></div>';}).join('');
 },
 sorders:async function(){
  var l=chk(await sb.from('orders').select('*').eq('seller_id',user.id).order('created_at',{ascending:false}));
  if(!l.length)return '<h2>طلبات المتجر</h2><div class="empty">لا توجد طلبات على منتجاتك بعد.</div>';
  var pv=await getPrivate(l.map(function(o){return o.id;}));
  return '<h2>طلبات المتجر</h2>'+l.map(function(o){
   var p=pv[o.id]||{};
   var t='<div class="card"><div class="head"><span class="name">'+esc(o.items)+'</span>'+badge(o.status)+'</div><div class="meta">المشتري: '+esc(o.buyer_name)+' · '+telLink(p.buyer_phone)+'</div>'+
    '<div class="meta">المبلغ: '+o.total+' دج · الدفع: '+(o.payment==='credit'?'بالآجل — يحتاج موافقتك':'نقداً')+'</div>';
   if(o.status==='pending_seller')t+='<div class="actions"><button class="btn sm" onclick="sellerDecide('+o.id+',true)">قبول وتجهيز</button><button class="btn danger sm" onclick="sellerDecide('+o.id+',false)">رفض</button></div>';
   return t+'</div>';}).join('');
 }
};

/* ===== الحساب ===== */
function setAuth(m){authMode=m;render();}
async function doAuth(e){
  e.preventDefault();var f=e.target,err=document.getElementById('err'),btn=document.getElementById('authBtn');
  var email=val(f,'email'),password=f.elements.password.value;
  if(!email){err.textContent='أدخل بريدك الإلكتروني.';return false;}
  if(!password){err.textContent='أدخل كلمة السر.';return false;}
  btn.disabled=true;err.textContent='';
  try{
    if(authMode==='signup'){
      var name=val(f,'name'),phone=val(f,'phone').replace(/\s+/g,'');
      if(!name){throw new Error('أدخل اسمك.');}
      if(!/^\+?[0-9]{8,15}$/.test(phone)){throw new Error('أدخل رقم هاتف صحيحاً (أرقام فقط).');}
      var r=await sb.auth.signUp({email:email,password:password,options:{data:{name:name,phone:phone}}});
      if(r.error)throw r.error;
      if(!r.data.session){err.textContent='تم إنشاء الحساب. تحقق من بريدك لتأكيده ثم سجّل الدخول.';btn.disabled=false;}
    }else{
      var r2=await sb.auth.signInWithPassword({email:email,password:password});
      if(r2.error)throw r2.error;
    }
  }catch(ex){err.textContent=msg(ex);btn.disabled=false;}
  return false;
}
function setRole(r){role=r;try{localStorage.setItem('souq_role',r);}catch(e){}tab=null;render();}
function switchRole(){role=null;try{localStorage.removeItem('souq_role');}catch(e){}tab=null;render();}
async function logout(){try{await sb.auth.signOut();}catch(e){}user=null;tab=null;render();}
function toggleInter(cb){document.getElementById('interBox').hidden=!cb.checked;}
function toggleProd(id){openProd=id;render();}
function setFilter(v){filterCat=v;render();}

/* ===== الإجراءات ===== */
async function act(promise,ok,next){
  try{var r=await promise;if(r&&r.error)throw r.error;if(ok)toast(ok);if(next)next();else render(true);}
  catch(e){toast(msg(e));render(true);}
}
async function submitErrand(e){
  e.preventDefault();var f=e.target,err=document.getElementById('err'),btn=document.getElementById('sendBtn');
  var fee=parseInt(val(f,'fee'),10),inter=document.getElementById('inter').checked;
  if(!val(f,'items')){err.textContent='اكتب ما تحتاجه.';return false;}
  if(!val(f,'area')){err.textContent='أدخل الحي أو المنطقة.';return false;}
  if(!val(f,'address')){err.textContent='أدخل عنوان التسليم.';return false;}
  if(isNaN(fee)||fee<0){err.textContent='أدخل عمولة صحيحة.';return false;}
  if(inter&&!val(f,'state')){err.textContent='أدخل اسم الولاية.';return false;}
  btn.disabled=true;err.textContent='';
  var r=await sb.rpc('create_errand',{p_cat:val(f,'cat'),p_items:val(f,'items'),p_area:val(f,'area'),p_address:val(f,'address'),p_fee:fee,p_inter:inter,p_state:val(f,'state'),p_veh:val(f,'veh')||'أي وسيلة'});
  if(r.error){err.textContent=msg(r.error);btn.disabled=false;return false;}
  toast('تم إرسال طلبك');go('mine');return false;
}
async function orderProduct(e,pid){
  e.preventDefault();var f=e.target,err=document.getElementById('err');
  var qty=parseInt(val(f,'qty'),10),fee=parseInt(val(f,'fee'),10);
  if(isNaN(qty)||qty<1){err.textContent='أدخل كمية صحيحة.';return false;}
  if(!val(f,'area')){err.textContent='أدخل الحي أو المنطقة.';return false;}
  if(!val(f,'address')){err.textContent='أدخل عنوان التسليم.';return false;}
  if(isNaN(fee)||fee<0){err.textContent='أدخل عمولة صحيحة.';return false;}
  var r=await sb.rpc('create_store_order',{p_product:pid,p_qty:qty,p_area:val(f,'area'),p_address:val(f,'address'),p_fee:fee,p_payment:val(f,'pay')});
  if(r.error){err.textContent=msg(r.error);return false;}
  openProd=null;toast('أُرسل الطلب إلى البائع');go('mine');return false;
}
function cancelOrder(id){act(sb.rpc('cancel_order',{p_id:id}),'أُلغي الطلب');}
function acceptOrder(id){act(sb.rpc('accept_order',{p_id:id}),'قبلت الطلب',function(){go('active');});}
function releaseOrder(id){act(sb.rpc('release_order',{p_id:id}),'تخلّيت عن الطلب');}
function markBought(id){
  var el=document.getElementById('paid'+id),amount=null;
  if(el){amount=parseInt(el.value,10);if(isNaN(amount)||amount<1){toast('أدخل المبلغ الذي دفعته');return;}}
  act(sb.rpc('mark_bought',{p_id:id,p_amount:amount}),'تم تسجيل الشراء');
}
function markDelivered(id){act(sb.rpc('mark_delivered',{p_id:id}),'تم التسليم. أُضيفت عمولتك');}
function sellerDecide(id,ok){act(sb.rpc('seller_decide',{p_id:id,p_ok:ok}),ok?'الطلب جاهز لعامل التوصيل':'رُفض الطلب');}
async function addProduct(e){
  e.preventDefault();var f=e.target,err=document.getElementById('err');
  var name=val(f,'name'),price=parseInt(val(f,'price'),10);
  if(!name){err.textContent='أدخل اسم المنتج.';return false;}
  if(isNaN(price)||price<1){err.textContent='أدخل سعراً صحيحاً.';return false;}
  var r=await sb.from('products').insert({seller_id:user.id,name:name,price:price,descr:val(f,'descr')||'—',interstate:f.elements.inter.checked});
  if(r.error){err.textContent=msg(r.error);return false;}
  toast('أُضيف المنتج');render();return false;
}
function delProduct(id){act(sb.from('products').delete().eq('id',id),'حُذف المنتج');}

/* ===== التشغيل ===== */
if(configured&&window.supabase){
  sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  sb.auth.onAuthStateChange(function(ev,session){user=session?session.user:null;render();});
  sb.auth.getSession().then(function(r){user=r.data&&r.data.session?r.data.session.user:null;render();});
  setInterval(function(){if(user&&role&&POLL_TABS.indexOf(tab)>-1&&!isEditing()&&!document.hidden)render(true);},10000);
}else render();
</script>
